<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Analytics - LocustHub</title>
    <meta
      name="description"
      content="User analytics dashboard for the ML Project."
    />
    <meta
      name="keywords"
      content="ML, Machine Learning, Prediction, Locust, Analytics, Dashboard"
    />

    <!-- Favicons -->
    <link href="assets/img/logo.webp" rel="icon" />
    <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;0,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files -->
    <link
      href="assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link
      href="assets/vendor/glightbox/css/glightbox.min.css"
      rel="stylesheet"
    />
    <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />

    <!-- Main CSS File -->
    <link href="assets/css/main.css" rel="stylesheet" />
    <link href="assets/css/analytics.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="starter-page-page">
    <main class="main">
      <div class="container-fluid">
        <div class="row">
          <!-- Sidebar -->
          <nav
            id="sidebar"
            class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse pt-3"
          >
            <div class="position-sticky">
              <div class="text-center mb-4">
                <div id="userInitials" class="initials-circle"></div>
                <h6 id="userName" class="mb-0"></h6>
              </div>
              <ul class="nav flex-column">
                <li class="nav-item">
                  <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-house-door me-2"></i>
                    Dashboard
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    aria-current="page"
                    href="analytics.html"
                  >
                    <i class="bi bi-graph-up me-2"></i>
                    Analytics
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="predict.html">
                    <i class="bi bi-lightning-charge-fill me-2"></i>
                    Prediction
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="reports.html">
                    <i class="bi bi-bar-chart me-2"></i>
                    Reports
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="settings.html">
                    <i class="bi bi-gear me-2"></i>
                    Settings
                  </a>
                </li>
                <li class="nav-item mt-4">
                  <a
                    class="nav-link text-danger"
                    href="#"
                    onclick="api.auth.logout()"
                  >
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Logout
                  </a>
                </li>
              </ul>
            </div>
          </nav>

          <!-- Main content -->
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-5">
            <h2>Analytics Dashboard</h2>
            <p>
              This is where your analytics charts and data visualizations will
              go.
            </p>

            <!-- Other Analytics Cards (Side by Side) -->
            <div class="row">
              <!-- Prediction Summary Card -->
              <div class="col-md-4 mb-4">
                <!-- Takes 4 columns on medium screens and up -->
                <div class="card h-100">
                  <div class="card-body">
                    <h5 class="card-title">Prediction Outcomes Summary</h5>
                    <canvas id="predictionSummaryChart"></canvas>
                  </div>
                </div>
              </div>

              <!-- Predictions Over Time Card -->
              <div class="col-md-4 mb-4">
                <!-- Takes 4 columns on medium screens and up -->
                <div class="card h-100">
                  <div class="card-body">
                    <h5 class="card-title">Predictions Over Time</h5>
                    <canvas id="predictionsOverTimeChart"></canvas>
                  </div>
                </div>
              </div>

              <!-- Environmental Factors Summary Card -->
              <div class="col-md-4 mb-4">
                <!-- Takes 4 columns on medium screens and up -->
                <div class="card h-100">
                  <div class="card-body">
                    <h5 class="card-title">
                      Average Environmental Factors by Outcome
                    </h5>
                    <canvas id="environmentalFactorsChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
            <!-- End of row for side-by-side cards -->

            <!-- Predictions by Location Card (Full Width) -->
            <div class="row">
              <div class="col-md-12 mb-4">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title">Predictions by Location</h5>
                    <canvas id="predictionsByLocationChart"></canvas>
                  </div>
                </div>
              </div>
            </div>

            <!-- Add more analytics content here as needed -->
          </main>
        </div>
      </div>
    </main>

    <!-- Scroll Top -->
    <a
      href="#"
      id="scroll-top"
      class="scroll-top d-flex align-items-center justify-content-center"
      ><i class="bi bi-arrow-up-short"></i
    ></a>

    <!-- Preloader -->
    <div id="preloader"></div>

    <!-- Vendor JS Files -->
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="assets/vendor/aos/aos.js"></script>
    <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
    <script src="assets/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
    <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
    <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>

    <!-- Main JS File -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/analytics.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
